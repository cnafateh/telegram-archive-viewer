name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        run: pytest -q

      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js

      - name: Build Docker image
        run: docker build -t telegram-archive-viewer:ci .
