<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1118">
  <title>{{ title }} — Sign in</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true">
    <div class="login-grid"></div>
    <div class="login-orb orb-a"></div>
    <div class="login-orb orb-b"></div>
  </div>

  <main class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24">
        <path d="M20.8 4.3 3.9 10.8c-1 .4-1 1.1-.2 1.4l4.4 1.4 1.7 5.2c.2.6.1.8.8.8.5 0 .8-.2 1-.4l2.2-2.1 4.5 3.3c.8.5 1.4.3 1.6-.8l2.9-13.2c.3-1.3-.5-1.9-2-1.4Z"/>
      </svg>
    </div>

    <span class="login-kicker">PRIVATE · SELF-HOSTED</span>
    <h1>{{ title }}</h1>
    <p>Your private Telegram history, searchable in one place.</p>

    {% if error %}
      <div class="login-error">
        <svg viewBox="0 0 24 24"><path d="M12 8v5m0 3h.01M12 3 3 20h18L12 3Z"/></svg>
        <span>Incorrect username or password.</span>
      </div>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <label for="username">Username</label>
      <div class="login-input">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0"/></svg>
        <input id="username" name="username" autocomplete="username" placeholder="Enter username" required autofocus>
      </div>

      <label for="password">Password</label>
      <div class="login-input">
        <svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2M5 10h14v11H5z"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <button class="login-submit" type="submit">
        <span>Open archive</span>
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </form>

    <div class="login-meta">
      <span><i></i> Local SQLite index</span>
      <span>Protected access</span>
    </div>
  </main>
</body>
</html>
